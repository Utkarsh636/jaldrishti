services:
  postgis:
    image: postgis/postgis:16-3.4
    container_name: jaldrishti-postgis
    environment:
      POSTGRES_DB: jaldrishti
      POSTGRES_USER: jaldrishti
      POSTGRES_PASSWORD: jaldrishti_dev
    ports:
      - "5432:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data

volumes:
  postgis_data: